[package]
name = "art-of-signature"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "policy-compiler"
path = "src/bin/main.rs"

[dependencies]
nom = "8.0.0"
tree-ds = "0.2.0"
ark-ec = { version = "0.5.0", default-features = false, git = "https://github.com/arkworks-rs/algebra", rev = "7601bf9" }
